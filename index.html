<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRGen Pro - Advanced QR Code Design Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&family=Space+Grotesk:wght=500;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- QR Code Matrix Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-logo {
      font-family: 'Space Grotesk', sans-serif;
    }
    /* Transparent Checkerboard Background */
    .checkerboard {
      background-color: #ffffff;
      background-image: radial-gradient(#e2e8f0 20%, transparent 20%),
                        radial-gradient(#e2e8f0 20%, transparent 20%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }
    .dark .checkerboard {
      background-color: #0f172a;
      background-image: radial-gradient(#334155 20%, transparent 20%),
                        radial-gradient(#334155 20%, transparent 20%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }
    /* Smooth custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 transition-colors duration-200 min-h-screen flex flex-col">

  <div id="root" class="flex flex-col flex-grow"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Presets / Design Templates
    const TEMPLATES = [
      {
        id: 'classic',
        name: 'Classic Pro',
        fgColor: '#000000',
        bgColor: '#ffffff',
        moduleStyle: 'square',
        eyeFrameStyle: 'square',
        eyeBallStyle: 'square',
        gradientType: 'none',
      },
      {
        id: 'neon-cyber',
        name: 'Cyberpunk Neon',
        fgColor: '#ec4899',
        bgColor: '#0f172a',
        moduleStyle: 'classy',
        eyeFrameStyle: 'rounded',
        eyeBallStyle: 'circle',
        gradientType: 'linear',
        gradientColor: '#3b82f6',
        gradientAngle: 135
      },
      {
        id: 'luxury-gold',
        name: 'Luxury Gold',
        fgColor: '#b45309',
        bgColor: '#1e1b4b',
        moduleStyle: 'diamond',
        eyeFrameStyle: 'leaf',
        eyeBallStyle: 'diamond',
        gradientType: 'linear',
        gradientColor: '#f59e0b',
        gradientAngle: 45
      },
      {
        id: 'organic-mint',
        name: 'Organic Mint',
        fgColor: '#047857',
        bgColor: '#f0fdf4',
        moduleStyle: 'dots',
        eyeFrameStyle: 'circle',
        eyeBallStyle: 'circle',
        gradientType: 'radial',
        gradientColor: '#10b981',
      },
      {
        id: 'minimalist-soft',
        name: 'Soft Slate',
        fgColor: '#334155',
        bgColor: '#f8fafc',
        moduleStyle: 'rounded',
        eyeFrameStyle: 'rounded',
        eyeBallStyle: 'rounded',
        gradientType: 'none'
      }
    ];

    function App() {
      // Dark Mode State
      const [darkMode, setDarkMode] = useState(false);
      
      // Active QR Type
      const [qrType, setQrType] = useState('url');
      
      // QR Form Data States - All initialized as empty strings
      const [formData, setFormData] = useState({
        url: '',
        text: '',
        emailAddress: '',
        emailSubject: '',
        emailBody: '',
        smsPhone: '',
        smsMessage: '',
        wifiSsid: '',
        wifiPass: '',
        wifiAuth: 'WPA2',
        wifiHidden: false,
        vcardFirst: '',
        vcardLast: '',
        vcardOrg: '',
        vcardTitle: '',
        vcardPhone: '',
        vcardEmail: '',
        vcardWeb: '',
        vcardAddr: '',
        vcardNote: '',
        cryptoCoin: 'Bitcoin',
        cryptoAddress: '',
        cryptoAmount: '',
        cryptoLabel: '',
        socialPlatform: 'instagram',
        socialHandle: '',
        otpIssuer: '',
        otpAccount: '',
        otpSecret: '',
        eventTitle: '',
        eventDesc: '',
        eventLoc: '',
        eventStart: '',
        eventEnd: '',
        upiId: '',
        upiName: '',
        upiAmount: '',
        phoneNum: '',
        mecardName: '',
        mecardPhone: '',
        mecardEmail: '',
        waPhone: '',
        waText: '',
        paypalUser: '',
        paypalAmount: '',
        appId: '',
        // Expanded dynamic type states
        chatPlatform: 'telegram',
        chatHandle: '',
        paymentPlatform: 'upi',
        paymentId: '',
        paymentAmount: '',
        paymentNote: '',
        appPlatform: 'apple',
        businessPlatform: 'review',
        businessUrl: '',
        filePlatform: 'drive',
        fileUrl: ''
      });

      // Style Configurations
      const [fgColor, setFgColor] = useState('#0c4a6e');
      const [bgColor, setBgColor] = useState('#ffffff');
      const [isBgTransparent, setIsBgTransparent] = useState(false);
      const [gradientType, setGradientType] = useState('none'); // none, linear, radial
      const [gradientColor, setGradientColor] = useState('#0ea5e9');
      const [gradientAngle, setGradientAngle] = useState(135);

      // Custom module and eye styles
      const [moduleStyle, setModuleStyle] = useState('square'); // square, rounded, dots, diamond, classy, star, heart
      const [eyeFrameStyle, setEyeFrameStyle] = useState('square'); // square, rounded, circle, leaf, hexagon
      const [eyeBallStyle, setEyeBallStyle] = useState('square'); // square, rounded, circle, diamond, star
      const [eyeColorCustom, setEyeColorCustom] = useState(false);
      const [eyeFrameColor, setEyeFrameColor] = useState('#0284c7');
      const [eyeBallColor, setEyeBallColor] = useState('#0369a1');

      // Logo properties
      const [logoFile, setLogoFile] = useState(null);
      const [logoPreview, setLogoPreview] = useState('');
      const [logoScale, setLogoScale] = useState(20); // % size relative to QR
      const [logoPadding, setLogoPadding] = useState(true); // Mask underlying modules

      // Frames & Label Properties
      const [frameStyle, setFrameStyle] = useState('none'); // none, rounded, speech, badge
      const [frameText, setFrameText] = useState('SCAN ME');
      const [frameColor, setFrameColor] = useState('#0c4a6e');

      // Error Correction & Advanced
      const [eccLevel, setEccLevel] = useState('Q'); // L (7%), M (15%), Q (25%), H (30%)
      const [quietZone, setQuietZone] = useState(4); // padding/margin around code
      
      // Dynamic Size variables (Support fractions / inches / metric standard conversion)
      const [sizeUnit, setSizeUnit] = useState('px'); // px, in, cm
      const [customSizeValue, setCustomSizeValue] = useState('512'); // numeric entry string
      const [viewMode, setViewMode] = useState('canvas'); // preview background: canvas, checkerboard

      // App Saved Projects / History
      const [history, setHistory] = useState([]);
      const [toast, setToast] = useState(null);

      // DOM Ref for SVGs
      const svgRef = useRef(null);

      // Calculates final resolution dynamically based on selected conversion rule (Standard 300 DPI target)
      const customSize = useMemo(() => {
        const val = parseFloat(customSizeValue) || 512;
        if (sizeUnit === 'px') return Math.round(val);
        if (sizeUnit === 'in') return Math.round(val * 300); // 300 DPI conversion mapping
        if (sizeUnit === 'cm') return Math.round((val / 2.54) * 300); // Metric mapping
        return 512;
      }, [customSizeValue, sizeUnit]);

      // System Mode Check
      useEffect(() => {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          setDarkMode(true);
        }
        // Load History
        const saved = localStorage.getItem('qr_history');
        if (saved) {
          try {
            setHistory(JSON.parse(saved));
          } catch(e) {}
        }
      }, []);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Helper function for triggers / toasts
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Reset Engine back to standard clean layout state
      const resetEngineToDefault = () => {
        setQrType('url');
        setFormData({
          url: '', text: '', emailAddress: '', emailSubject: '', emailBody: '',
          smsPhone: '', smsMessage: '', wifiSsid: '', wifiPass: '', wifiAuth: 'WPA2', wifiHidden: false,
          vcardFirst: '', vcardLast: '', vcardOrg: '', vcardTitle: '', vcardPhone: '', vcardEmail: '', vcardWeb: '', vcardAddr: '', vcardNote: '',
          cryptoCoin: 'Bitcoin', cryptoAddress: '', cryptoAmount: '', cryptoLabel: '',
          socialPlatform: 'instagram', socialHandle: '', otpIssuer: '', otpAccount: '', otpSecret: '',
          eventTitle: '', eventDesc: '', eventLoc: '', eventStart: '', eventEnd: '',
          upiId: '', upiName: '', upiAmount: '',
          phoneNum: '', mecardName: '', mecardPhone: '', mecardEmail: '', waPhone: '', waText: '', paypalUser: '', paypalAmount: '', appId: '',
          chatPlatform: 'telegram', chatHandle: '', paymentPlatform: 'upi', paymentId: '', paymentAmount: '', paymentNote: '',
          appPlatform: 'apple', businessPlatform: 'review', businessUrl: '', filePlatform: 'drive', fileUrl: ''
        });
        setFgColor('#0c4a6e');
        setBgColor('#ffffff');
        setIsBgTransparent(false);
        setGradientType('none');
        setGradientColor('#0ea5e9');
        setGradientAngle(135);
        setModuleStyle('square');
        setEyeFrameStyle('square');
        setEyeBallStyle('square');
        setEyeColorCustom(false);
        setEyeFrameColor('#0284c7');
        setEyeBallColor('#0369a1');
        setLogoFile(null);
        setLogoPreview('');
        setLogoScale(20);
        setLogoPadding(true);
        setFrameStyle('none');
        setFrameText('SCAN ME');
        setFrameColor('#0c4a6e');
        setEccLevel('Q');
        setQuietZone(4);
        setSizeUnit('px');
        setCustomSizeValue('512');
        showToast("Engine configuration successfully reset to default factory slate!");
      };

      // Handle Inputs
      const handleInputChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      // Handle Logo Upload
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setLogoFile(file);
            setLogoPreview(event.target.result);
            // Suggest higher ECC if logo uploaded
            if (eccLevel === 'L' || eccLevel === 'M') {
              setEccLevel('Q');
              showToast("Error Correction Level increased to Q (25%) for logo readability!", "info");
            } else {
              showToast("Logo imported successfully!");
            }
          };
          reader.readAsDataURL(file);
        }
      };

      const removeLogo = () => {
        setLogoFile(null);
        setLogoPreview('');
        showToast("Logo removed.");
      };

      // Template Selection
      const applyTemplate = (tpl) => {
        setFgColor(tpl.fgColor);
        setBgColor(tpl.bgColor);
        setModuleStyle(tpl.moduleStyle);
        setEyeFrameStyle(tpl.eyeFrameStyle);
        setEyeBallStyle(tpl.eyeBallStyle);
        setGradientType(tpl.gradientType);
        if (tpl.gradientColor) setGradientColor(tpl.gradientColor);
        if (tpl.gradientAngle) setGradientAngle(tpl.gradientAngle);
        setIsBgTransparent(tpl.bgColor === 'transparent');
        showToast(`Template "${tpl.name}" applied!`);
      };

      // Compile content string based on active QR type
      const qrRawContent = useMemo(() => {
        // Fallback default if completely blank
        const isAllBlank = Object.values(formData).every(v => v === '' || v === false || v === 'WPA2' || v === 'Bitcoin' || v === 'instagram' || v === 'telegram' || v === 'upi' || v === 'apple' || v === 'review' || v === 'drive');
        if (isAllBlank) {
          return "https://github.com"; // Standard clean fallback so preview compiles
        }

        switch (qrType) {
          case 'url':
            return formData.url || 'https://github.com';
          case 'text':
            return formData.text || ' ';
          case 'phone':
            return formData.phoneNum ? `tel:${formData.phoneNum}` : 'tel:';
          case 'mecard':
            return `MECARD:N:${formData.mecardName};TEL:${formData.mecardPhone};EMAIL:${formData.mecardEmail};;`;
          case 'whatsapp':
            return `https://wa.me/${formData.waPhone || ''}?text=${encodeURIComponent(formData.waText || '')}`;
          case 'paypal':
            return `https://www.paypal.com/paypalme/${formData.paypalUser || ''}/${formData.paypalAmount || ''}`;
          case 'appstore':
            if (formData.appPlatform === 'apple') return `https://apps.apple.com/app/id${formData.appId || ''}`;
            if (formData.appPlatform === 'play') return `https://play.google.com/store/apps/details?id=${formData.appId || ''}`;
            if (formData.appPlatform === 'huawei') return `https://appgallery.huawei.com/app/C${formData.appId || ''}`;
            return formData.appId || 'https://github.com';
          case 'email':
            return `mailto:${formData.emailAddress || ''}?subject=${encodeURIComponent(formData.emailSubject || '')}&body=${encodeURIComponent(formData.emailBody || '')}`;
          case 'sms':
            return `SMSTO:${formData.smsPhone || ''}:${formData.smsMessage || ''}`;
          case 'wifi':
            return `WIFI:S:${formData.wifiSsid || ''};T:${formData.wifiAuth || 'nopass'};P:${formData.wifiPass || ''};${formData.wifiHidden ? 'H:true' : ''};;`;
          case 'vcard':
            return [
              'BEGIN:VCARD',
              'VERSION:3.0',
              `N:${formData.vcardLast || ''};${formData.vcardFirst || ''};;;`,
              `FN:${formData.vcardFirst || ''} ${formData.vcardLast || ''}`,
              formData.vcardOrg ? `ORG:${formData.vcardOrg}` : '',
              formData.vcardTitle ? `TITLE:${formData.vcardTitle}` : '',
              formData.vcardPhone ? `TEL;TYPE=CELL:${formData.vcardPhone}` : '',
              formData.vcardEmail ? `EMAIL;TYPE=PREF,INTERNET:${formData.vcardEmail}` : '',
              formData.vcardWeb ? `URL:${formData.vcardWeb}` : '',
              formData.vcardAddr ? `ADR;TYPE=WORK:;;${formData.vcardAddr};;;` : '',
              formData.vcardNote ? `NOTE:${formData.vcardNote}` : '',
              'END:VCARD'
            ].filter(Boolean).join('\n');
          case 'crypto':
            const coinPrefix = {
              'Bitcoin': 'bitcoin',
              'Ethereum': 'ethereum',
              'Litecoin': 'litecoin',
              'Monero': 'monero',
              'Solana': 'solana',
              'Dogecoin': 'dogecoin',
              'USDT': 'usdt',
              'Binance Smart Chain': 'bnb'
            }[formData.cryptoCoin] || 'bitcoin';
            return `${coinPrefix}:${formData.cryptoAddress || ''}?amount=${formData.cryptoAmount || ''}&label=${encodeURIComponent(formData.cryptoLabel || '')}`;
          case 'social':
            const platformBase = {
              instagram: 'https://instagram.com/',
              twitter: 'https://twitter.com/',
              linkedin: 'https://linkedin.com/in/',
              youtube: 'https://youtube.com/@',
              github: 'https://github.com/',
              facebook: 'https://facebook.com/',
              threads: 'https://threads.net/@',
              tiktok: 'https://tiktok.com/@',
              pinterest: 'https://pinterest.com/',
              discord: 'https://discord.gg/',
              reddit: 'https://reddit.com/user/',
              behance: 'https://behance.net/',
              dribbble: 'https://dribbble.com/',
              medium: 'https://medium.com/@',
              snapchat: 'https://snapchat.com/add/',
              twitch: 'https://twitch.tv/',
              kick: 'https://kick.com/',
              spotify: 'https://open.spotify.com/user/',
              applemusic: 'https://music.apple.com/profile/',
              soundcloud: 'https://soundcloud.com/',
              linktree: 'https://linktr.ee/'
            }[formData.socialPlatform] || '';
            return `${platformBase}${formData.socialHandle || ''}`;
          case 'otp':
            return `otpauth://totp/${encodeURIComponent(formData.otpIssuer || 'Service')}:${encodeURIComponent(formData.otpAccount || 'user')}}?secret=${formData.otpSecret || 'SECRET'}&issuer=${encodeURIComponent(formData.otpIssuer || '')}`;
          case 'event':
            const startStr = (formData.eventStart || '').replace(/[-:]/g, '') + '00Z';
            const endStr = (formData.eventEnd || '').replace(/[-:]/g, '') + '00Z';
            return [
              'BEGIN:VCALENDAR',
              'VERSION:2.0',
              'BEGIN:VEVENT',
              `SUMMARY:${formData.eventTitle || ''}`,
              `DESCRIPTION:${formData.eventDesc || ''}`,
              `LOCATION:${formData.eventLoc || ''}`,
              `DTSTART:${startStr}`,
              `DTEND:${endStr}`,
              'END:VEVENT',
              'END:VCALENDAR'
            ].join('\n');
          case 'upi':
            return `upi://pay?pa=${formData.upiId || ''}&pn=${encodeURIComponent(formData.upiName || '')}&am=${formData.upiAmount || ''}&cu=INR`;
          case 'chat':
            if (formData.chatPlatform === 'telegram') return `https://t.me/${formData.chatHandle || ''}`;
            if (formData.chatPlatform === 'signal') return `https://signal.me/#p/${formData.chatHandle || ''}`;
            if (formData.chatPlatform === 'skype') return `skype:${formData.chatHandle || ''}?chat`;
            if (formData.chatPlatform === 'facetime') return `facetime:${formData.chatHandle || ''}`;
            return '';
          case 'payment':
            if (formData.paymentPlatform === 'upi') return `upi://pay?pa=${formData.paymentId || ''}&am=${formData.paymentAmount || ''}&cu=INR`;
            if (formData.paymentPlatform === 'paypal') return `https://paypal.me/${formData.paymentId || ''}/${formData.paymentAmount || ''}`;
            if (formData.paymentPlatform === 'stripe') return formData.paymentId || 'https://stripe.com';
            if (formData.paymentPlatform === 'venmo') return `venmo://paycharge?txn=pay&recipients=${formData.paymentId || ''}&amount=${formData.paymentAmount || ''}`;
            if (formData.paymentPlatform === 'cashapp') return `https://cash.app/$${formData.paymentId || ''}/${formData.paymentAmount || ''}`;
            return `Bank Transfer: ${formData.paymentId || ''}, Ref: ${formData.paymentNote || ''}`;
          case 'business':
            if (formData.businessPlatform === 'maps') return `https://maps.google.com/?q=${encodeURIComponent(formData.businessUrl || '')}`;
            return formData.businessUrl || 'https://google.com';
          case 'filelink':
            return formData.fileUrl || 'https://drive.google.com';
          default:
            return '';
        }
      }, [qrType, formData]);

      // Calculate state statistics & Scan Quality
      const qrMatrix = useMemo(() => {
        try {
          const qr = qrcode(0, eccLevel); // Auto select version
          qr.addData(qrRawContent || ' ');
          qr.make();
          return qr;
        } catch (e) {
          console.error(e);
          return null;
        }
      }, [qrRawContent, eccLevel]);

      // Diagnostics & Analysis
      const diagnostics = useMemo(() => {
        if (!qrMatrix) return { score: 0, rating: 'Unknown', warnings: [] };
        
        let warnings = [];
        let score = 100;

        // 1. Contrast Check
        if (fgColor.toLowerCase() === bgColor.toLowerCase()) {
          warnings.push("Colors match perfectly! The QR code will be completely invisible and unscannable.");
          score -= 90;
        }

        // 2. Logo Size Risk
        if (logoPreview && logoScale > 28) {
          warnings.push(`Logo is very large (${logoScale}%). Scan reliability is severely compromised. Please scale down below 25% or use High (H) Error Correction.`);
          score -= 30;
        }

        // 3. Complex custom elements with Low ECC
        if ((moduleStyle !== 'square' || eyeFrameStyle !== 'square') && (eccLevel === 'L' || eccLevel === 'M')) {
          warnings.push("Intricate modules or eye styles are applied. Consider upgrading to High (H) or Quality (Q) ECC.");
          score -= 10;
        }

        // 4. Background transparency warning
        if (isBgTransparent) {
          warnings.push("Using transparent background. Ensure you place the QR on high-contrast, light-colored solid layouts when printed.");
          score -= 10;
        }

        let rating = 'Excellent';
        if (score >= 90) rating = 'Excellent ✨';
        else if (score >= 75) rating = 'Good 👍';
        else if (score >= 50) rating = 'Average ⚠️';
        else rating = 'Poor ❌';

        return {
          score,
          rating,
          warnings,
          version: qrMatrix.getModuleCount() ? Math.floor((qrMatrix.getModuleCount() - 17) / 4) : 1,
          modulesCount: qrMatrix.getModuleCount()
        };
      }, [qrMatrix, fgColor, bgColor, isBgTransparent, logoPreview, logoScale, moduleStyle, eyeFrameStyle, eccLevel]);

      // Render Dynamic Custom Path for QR Code Modules
      const renderQRPaths = () => {
        if (!qrMatrix) return null;
        const count = qrMatrix.getModuleCount();
        const size = 400; // Fixed canvas working size inside SVG
        const scale = size / count;

        const pathSegments = [];

        // Identify Finder Patterns to skip and style separately
        const isFinderPattern = (row, col) => {
          if (row < 7 && col < 7) return true; // Top Left
          if (row < 7 && col >= count - 7) return true; // Top Right
          if (row >= count - 7 && col < 7) return true; // Bottom Left
          return false;
        };

        // Check if point falls within Logo bounding safety zone (center area)
        const isInsideLogoZone = (row, col) => {
          if (!logoPreview || !logoPadding) return false;
          const center = count / 2;
          const radius = (count * (logoScale / 100)) / 2 + 1; // plus safety boundary
          const distRow = Math.abs(row - center + 0.5);
          const distCol = Math.abs(col - center + 0.5);
          return distRow < radius && distCol < radius;
        };

        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qrMatrix.isDark(r, c)) {
              if (isFinderPattern(r, c)) continue; // Handled separately
              if (isInsideLogoZone(r, c)) continue; // Masked for logo spacing

              const x = c * scale;
              const y = r * scale;
              const w = scale;
              const h = scale;

              // Generate custom geometries
              if (moduleStyle === 'dots') {
                const cx = x + w / 2;
                const cy = y + h / 2;
                const r_rad = w / 2 * 0.85;
                pathSegments.push(`M ${cx} ${cy} m -${r_rad},0 a ${r_rad},${r_rad} 0 1,0 ${r_rad*2},0 a ${r_rad},${r_rad} 0 1,0 -${r_rad*2},0`);
              } else if (moduleStyle === 'rounded') {
                const r_rad = w * 0.35;
                pathSegments.push(`M ${x + r_rad} ${y} h ${w - 2*r_rad} a ${r_rad},${r_rad} 0 0 1 ${r_rad},${r_rad} v ${h - 2*r_rad} a ${r_rad},${r_rad} 0 0 1 -${r_rad},${r_rad} h -${w - 2*r_rad} a ${r_rad},${r_rad} 0 0 1 -${r_rad},-${r_rad} v -${h - 2*r_rad} a ${r_rad},${r_rad} 0 0 1 ${r_rad},-${r_rad} Z`);
              } else if (moduleStyle === 'diamond') {
                pathSegments.push(`M ${x + w/2} ${y} L ${x + w} ${y + h/2} L ${x + w/2} ${y + h} L ${x} ${y + h/2} Z`);
              } else if (moduleStyle === 'classy') {
                const r_rad = w / 2;
                pathSegments.push(`M ${x + r_rad} ${y} h ${r_rad} v ${r_rad} a ${r_rad},${r_rad} 0 0 1 -${r_rad},${r_rad} h -${r_rad} v -${r_rad} a ${r_rad},${r_rad} 0 0 1 ${r_rad},-${r_rad} Z`);
              } else if (moduleStyle === 'star') {
                const cx = x + w / 2;
                const cy = y + h / 2;
                pathSegments.push(`M ${cx} ${y} L ${cx + w/4} ${cy - h/4} L ${x + w} ${cy} L ${cx + w/4} ${cy + h/4} L ${cx} ${y + h} L ${cx - w/4} ${cy + h/4} L ${x} ${cy} L ${cx - w/4} ${cy - h/4} Z`);
              } else if (moduleStyle === 'heart') {
                const cx = x + w / 2;
                const cy = y + h / 2;
                pathSegments.push(`M ${cx} ${y + h*0.8} C ${x} ${cy} ${x} ${y} ${cx} ${y + h*0.3} C ${x + w} ${y} ${x + w} ${cy} ${cx} ${y + h*0.8} Z`);
              } else {
                pathSegments.push(`M ${x} ${y} H ${x + w} V ${y + h} H ${x} Z`);
              }
            }
          }
        }
        return <path d={pathSegments.join(' ')} fill="url(#qrGradient)" />;
      };

      // Custom Eye Designer
      const renderEyes = () => {
        if (!qrMatrix) return null;
        const count = qrMatrix.getModuleCount();
        const size = 400;
        const scale = size / count;

        const eyePositions = [
          { r: 0, c: 0 }, // Top Left
          { r: 0, c: count - 7 }, // Top Right
          { r: count - 7, c: 0 } // Bottom Left
        ];

        return eyePositions.map((pos, idx) => {
          const x = pos.c * scale;
          const y = pos.r * scale;
          const eyeWidth = scale * 7;
          
          const ballOffset = scale * 2;
          const ballWidth = scale * 3;

          const frameColorVal = eyeColorCustom ? eyeFrameColor : 'url(#qrGradient)';
          const ballColorVal = eyeColorCustom ? eyeBallColor : 'url(#qrGradient)';

          // Frame Renderers
          const renderFrame = () => {
            switch(eyeFrameStyle) {
              case 'rounded':
                const rad = eyeWidth * 0.25;
                return <path d={`M ${x + rad} ${y} h ${eyeWidth - 2*rad} a ${rad},${rad} 0 0 1 ${rad},${rad} v ${eyeWidth - 2*rad} a ${rad},${rad} 0 0 1 -${rad},${rad} h -${eyeWidth - 2*rad} a ${rad},${rad} 0 0 1 -${rad},-${rad} v -${eyeWidth - 2*rad} a ${rad},${rad} 0 0 1 ${rad},-${rad} Z M ${x + scale} ${y + scale} v ${eyeWidth - 2*scale} h ${eyeWidth - 2*scale} v -${eyeWidth - 2*scale} Z`} fill={frameColorVal} fillRule="evenodd" />;
              case 'circle':
                const r = eyeWidth / 2;
                return <path d={`M ${x + r} ${y} a ${r},${r} 0 1,0 0.1,0 Z M ${x + r} ${y + scale} a ${r - scale},${r - scale} 0 1,1 -0.1,0 Z`} fill={frameColorVal} fillRule="evenodd" />;
              case 'leaf':
                return <path d={`M ${x} ${y} Q ${x + eyeWidth} ${y} ${x + eyeWidth} ${y + eyeWidth} Q ${x} ${y + eyeWidth} ${x} ${y} Z M ${x + scale} ${y + scale} v ${eyeWidth - 2*scale} h ${eyeWidth - 2*scale} v -${eyeWidth - 2*scale} Z`} fill={frameColorVal} fillRule="evenodd" />;
              case 'hexagon':
                return <polygon points={`${x + eyeWidth/2},${y} ${x + eyeWidth},${y + eyeWidth/3} ${x + eyeWidth},${y + 2*eyeWidth/3} ${x + eyeWidth/2},${y + eyeWidth} ${x},${y + 2*eyeWidth/3} ${x},${y + eyeWidth/3}`} fill={frameColorVal} />;
              case 'square':
              default:
                return <path d={`M ${x} ${y} h ${eyeWidth} v ${eyeWidth} h -${eyeWidth} Z M ${x + scale} ${y + scale} v ${eyeWidth - 2*scale} h ${eyeWidth - 2*scale} v -${eyeWidth - 2*scale} Z`} fill={frameColorVal} fillRule="evenodd" />;
            }
          };

          // Ball Renderers
          const renderBall = () => {
            const bx = x + ballOffset;
            const by = y + ballOffset;
            const bw = ballWidth;

            switch(eyeBallStyle) {
              case 'circle':
                return <circle cx={bx + bw/2} cy={by + bw/2} r={bw/2} fill={ballColorVal} />;
              case 'rounded':
                const brad = bw * 0.3;
                return <rect x={bx} y={by} width={bw} height={bw} rx={brad} ry={brad} fill={ballColorVal} />;
              case 'diamond':
                return <polygon points={`${bx + bw/2},${by} ${bx + bw},${by + bw/2} ${bx + bw/2},${by + bw} ${bx},${by + bw/2}`} fill={ballColorVal} />;
              case 'star':
                return <path d={`M ${bx + bw/2} ${by} L ${bx + bw*0.65} ${by + bw*0.35} L ${bx + bw} ${by + bw/2} L ${bx + bw*0.65} ${by + bw*0.65} L ${bx + bw/2} ${by + bw} L ${bx + bw*0.35} ${by + bw*0.65} L ${bx} ${by + bw/2} L ${bx + bw*0.35} ${by + bw*0.35} Z`} fill={ballColorVal} />;
              case 'square':
              default:
                return <rect x={bx} y={by} width={bw} height={bw} fill={ballColorVal} />;
            }
          };

          return (
            <g key={idx}>
              {renderFrame()}
              {renderBall()}
            </g>
          );
        });
      };

      // Save design config to browser storage history
      const saveToHistory = () => {

            gradientColor,
            moduleStyle,
            eyeFrameStyle,
            eyeBallStyle,
            logoPreview,
            frameStyle,
            frameText,
            frameColor

        const updated = [item, ...history.slice(0, 24)]; // Keep last 25
        setHistory(updated);
        localStorage.setItem('qr_history', JSON.stringify(updated));

      // Export handler for Vector and Raster formats
      const downloadQR = (format) => {
        if (!svgRef.current) return;

        const originalSvg = svgRef.current;
        const svgString = new XMLSerializer().serializeToString(originalSvg);

        if (format === 'svg') {
          const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const downloadLink = document.createElement('a');
          downloadLink.href = url;
          downloadLink.download = `qrgen_pro_${Date.now()}.svg`;
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          URL.revokeObjectURL(url);
          showToast("Vector SVG downloaded!");
          return;
        }

        // Raster Exports (PNG, JPG, WEBP)
        const image = new Image();
        const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        image.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = customSize;
          canvas.height = customSize;
          
          const context = canvas.getContext('2d');
          
          if (format === 'jpg' || format === 'jpeg') {
            context.fillStyle = isBgTransparent ? '#ffffff' : bgColor;
            context.fillRect(0, 0, customSize, customSize);
          }

          context.drawImage(image, 0, 0, customSize, customSize);
          
          const mimeType = {
            'png': 'image/png',
            'jpg': 'image/jpeg',
            'jpeg': 'image/jpeg',
            'webp': 'image/webp'
          }[format] || 'image/png';

          const dataUrl = canvas.toDataURL(mimeType, 0.95);
          const downloadLink = document.createElement('a');
          downloadLink.href = dataUrl;
          downloadLink.download = `qrgen_pro_${Date.now()}.${format}`;
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          URL.revokeObjectURL(url);
          showToast(`High-res ${format.toUpperCase()} export completed!`);
        };

        image.src = url;
      };

      // Clipboard Actions
      const copyToClipboard = (action) => {

        const svgString = new XMLSerializer().serializeToString(svgRef.current);

          el.value = `data:image/svg+xml;base64,${base64Str}`;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          showToast("Base64 Data URI copied!");

                        />

                    </div>

                        </div>
                      </div>
                    </div>

                        { level: 'L', desc: 'Low (7%)' },

                        <button
                          key={item.level}
                          onClick={() => setEccLevel(item.level)}
                          className={`py-2 text-[11px] font-semibold rounded-lg border text-center transition-all ${
                            eccLevel === item.level 
                              ? 'border-brand-500 bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 shadow-sm' 
                              : 'border-slate-200 dark:border-slate-800 text-slate-500'
                          }`}

                          <div>{item.level}</div>

                      <option value="1">Minimal (1px)</option>
                      <option value="2">Compact (2px)</option>
                      <option value="4">Standard (4px)</option>
                      <option value="6">Safe Print (6px)</option>
                    </select>
                  </div>
                </div>

              </div>

                  {/* MASTER SVG RENDER PIPELINE */}

                      {gradientType === 'linear' ? (

                          <stop offset="0%" stopColor={fgColor} />
                          <stop offset="100%" stopColor={gradientColor} />
                        </linearGradient>
                      ) : gradientType === 'radial' ? (
                        <radialGradient id="qrGradient" cx="50%" cy="50%" r="50%">
                          <stop offset="0%" stopColor={fgColor} />
                          <stop offset="100%" stopColor={gradientColor} />
                        </radialGradient>
                      ) : (
                        <linearGradient id="qrGradient">
                          <stop offset="0%" stopColor={fgColor} />
                          <stop offset="100%" stopColor={fgColor} />
                        </linearGradient>
                      )}

                          <path d="M 0 0 h 400 v 400 H 220 L 200 425 L 180 400 H 0 Z" fill="none" stroke={frameColor} strokeWidth="10" />
                        )}

                        {frameStyle === 'badge' && (
                          <g>
                            {/* Frame background container */}
                            <path d="M 10 395 h 380 v 45 a 15,15 0 0 1 -15,15 H 25 a 15,15 0 0 1 -15,-15 Z" fill={frameColor} />
                            {/* Simple text element in standard SVG coordinates */}
                            <text 
                              x="200" 
                              y="428" 
                              textAnchor="middle" 
                              fill="#ffffff" 
                              fontWeight="bold" 
                              fontSize="14px"
                              letterSpacing="3"

                              preserveAspectRatio="xMidYMid meet"

                      <g>
                        {renderQRPaths()}
                        {renderEyes()}
                        {logoPreview && (

                            x={200 - (200 * (logoScale/100))} 
                            y={200 - (200 * (logoScale/100))} 
                            width={400 * (logoScale/100)} 
                            height={400 * (logoScale/100)} 
                            preserveAspectRatio="xMidYMid meet"
                          />

                <div class="text-right">

                  <p class="text-xs font-semibold text-slate-600 dark:text-slate-300">v{diagnostics.version} ({diagnostics.modulesCount}x{diagnostics.modulesCount} px)</p>

                  <ul class="list-disc pl-4 space-y-1">

                    ))}
                  </ul>
                </div>
              )}

              {/* Target Metadata Information */}

                <div class="space-y-3">
                  <div class="p-3 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-100 dark:border-slate-850">
                    <div class="flex justify-between items-center text-xs">
                      <span class="text-slate-500">Contrast Reliability</span>
                      <span class="font-bold text-emerald-600">Secure (12.4:1)</span>
                    </div>
                  </div>
                  <div class="p-3 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-100 dark:border-slate-850">
                    <div class="flex justify-between items-center text-xs">
                      <span class="text-slate-500">Est. Scan Distance</span>
                      <span class="font-semibold text-slate-700 dark:text-slate-300">~ 1.2 meters</span>
                    </div>
                  </div>
                  <div class="p-3 bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-100 dark:border-slate-850">
                    <div class="flex justify-between items-center text-xs">
                      <span class="text-slate-500">Module Structure</span>
                      <span class="font-semibold text-slate-700 dark:text-slate-300 capitalize">{moduleStyle} Pixels</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Dynamic Size & Fractional Conversion Unit Selector */}

                    <button
                      key={unit}
                      onClick={() => {
                        setSizeUnit(unit);
                        setCustomSizeValue(unit === 'px' ? '512' : unit === 'in' ? '1.7' : '4.3');

                      className={`py-1 text-xs font-semibold rounded-md uppercase transition-all ${
                        sizeUnit === unit 
                          ? 'bg-white dark:bg-slate-800 text-brand-600 shadow-xs'

                      {unit}
                    </button>

                  <label class="text-[11px] font-medium text-slate-400">Dimension Magnitude</label>

                    onChange={(e) => setCustomSizeValue(e.target.value)}

                  />

                {/* Live validation feedback read-out */}
                <div class="text-[11px] text-slate-400 flex items-center justify-between">
                  <span>Calculated Target:</span>
                  <span class="font-bold text-slate-700 dark:text-slate-300 font-mono">{customSize} x {customSize} px</span>
                </div>
              </div>

              {/* Action Buttons: Download and Export Panel */}
              <div class="space-y-4 pt-4 border-t border-slate-100 dark:border-slate-800">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Download & Vector Export</h3>
                
                <div class="grid grid-cols-2 gap-2">
                  <button 
                    onClick={() => downloadQR('png')}
                    className="flex items-center justify-center gap-2 py-3 px-4 text-xs font-bold text-slate-700 dark:text-slate-300 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-xl transition-all duration-200"
                  >
                    <i data-lucide="image" class="w-4 h-4"></i>
                    PNG
                  </button>
                  <button 
                    onClick={() => downloadQR('jpg')}
                    className="flex items-center justify-center gap-2 py-3 px-4 text-xs font-bold text-slate-700 dark:text-slate-300 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-xl transition-all duration-200"
                  >
                    <i data-lucide="image" class="w-4 h-4"></i>
                    JPEG
                  </button>
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <button 
                    onClick={() => downloadQR('webp')}
                    className="flex items-center justify-center gap-2 py-3 px-4 text-xs font-bold text-slate-700 dark:text-slate-300 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-xl transition-all duration-200"
                  >
                    <i data-lucide="image" class="w-4 h-4"></i>
                    WEBP
                  </button>
                  <button 
                    onClick={() => downloadQR('svg')}
                    className="flex items-center justify-center gap-2 py-3 px-4 text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 rounded-xl transition-all duration-200 shadow-lg shadow-brand-500/15"
                  >
                    <i data-lucide="vector" class="w-4 h-4"></i>
                    SVG Vector
                  </button>
                </div>

                <div class="space-y-2 pt-2">
                  <button 
                    onClick={() => copyToClipboard('raw')}
                    className="w-full flex items-center justify-center gap-2 py-2.5 text-xs font-medium border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-850 rounded-xl transition-all text-slate-600 dark:text-slate-400"
                  >
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    Copy Raw SVG Markup
                  </button>
                  <button 
                    onClick={() => copyToClipboard('base64')}
                    className="w-full flex items-center justify-center gap-2 py-2.5 text-xs font-medium border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-850 rounded-xl transition-all text-slate-600 dark:text-slate-400"
                  >
                    <i data-lucide="code" class="w-3.5 h-3.5"></i>
                    Copy Base64 Data URI
                  </button>
                </div>
              </div>

              {/* History Section Panel */}
              <div class="space-y-3 pt-4 border-t border-slate-100 dark:border-slate-800 flex-grow">
                <div class="flex justify-between items-center">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Local Design History</h3>
                  <button 
                    onClick={() => {
                      setHistory([]);
                      localStorage.removeItem('qr_history');
                      showToast("History cleared.");
                    }}
                    class="text-[10px] text-rose-500 hover:underline"
                  >
                    Clear All
                  </button>
                </div>

                {history.length === 0 ? (
                  <div class="text-center py-6 border border-dashed border-slate-150 dark:border-slate-800 rounded-xl">
                    <p class="text-xs text-slate-400">No saved QR codes found.</p>
                  </div>
                ) : (
                  <div class="space-y-2.5 max-h-[190px] overflow-y-auto pr-1">
                    {history.map((item) => (
                      <div 
                        key={item.id} 
                        onClick={() => {
                          setQrType(item.type);
                          setFgColor(item.config.fgColor);
                          setBgColor(item.config.bgColor);
                          setGradientType(item.config.gradientType);
                          setGradientColor(item.config.gradientColor);
                          setModuleStyle(item.config.moduleStyle);
                          setEyeFrameStyle(item.config.eyeFrameStyle);
                          setEyeBallStyle(item.config.eyeBallStyle);
                          if (item.config.logoPreview) setLogoPreview(item.config.logoPreview);
                          setFrameStyle(item.config.frameStyle);
                          setFrameText(item.config.frameText);
                          setFrameColor(item.config.frameColor);
                          showToast("Previous layout configuration loaded!");
                        }}
                        class="p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-850 hover:border-brand-500 rounded-lg cursor-pointer transition-all flex items-center justify-between text-left"
                      >
                        <div>
                          <p class="text-xs font-bold text-slate-700 dark:text-slate-300 capitalize">{item.type} Type</p>
                          <p class="text-[10px] text-slate-400 truncate max-w-[130px]">{item.label}</p>
                        </div>
                        <span class="text-[9px] text-slate-400">{item.date}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

            </aside>

          </div>

          {/* Toast Notification Element */}
          {toast && (
            <div class="fixed bottom-6 right-6 z-50 flex items-center gap-2 px-4 py-3 bg-slate-900 text-white dark:bg-white dark:text-slate-950 text-xs font-semibold rounded-xl shadow-xl animate-bounce">
              <i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i>
              {toast.message}
            </div>
          )}

        </div>
      );
    }

    // Initialize React Root
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

    // Initialize/Render Lucide Icons
    setTimeout(() => {
      lucide.createIcons();
    }, 500);

    // Watch for dynamic DOM changes to refresh Lucide SVG icons smoothly without infinite loops
    const observer = new MutationObserver(() => {
      observer.disconnect(); // Turn off observer while modifying DOM
      lucide.createIcons();   // Modify DOM safely
      observer.observe(document.body, { childList: true, subtree: true }); // Restart observing
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
